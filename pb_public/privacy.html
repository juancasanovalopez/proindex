<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="privacyTitle"></title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script defer src="./js/app.js"></script>
</head>
<body>
    <main class="container site-container privacy-page">
        <header class="blog-header">
            <a class="blog-brand" href="./">Pro Index</a>
            <a class="blog-nav-link" href="./" data-i18n="privacyBack"></a>
            <div class="dropdown style-switcher">
                <button class="btn style-switcher-toggle dropdown-toggle" type="button" id="style-menu-privacy" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-palette2" aria-hidden="true"></i>
                    <span data-i18n="styleLabel"></span>:
                    <span data-current-style></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="style-menu-privacy">
                    <li><button class="dropdown-item" type="button" role="menuitemradio" value="16bit" data-visual-style-option data-i18n="style16Bit" aria-checked="false"></button></li>
                    <li><button class="dropdown-item" type="button" role="menuitemradio" value="original" data-visual-style-option data-i18n="styleOriginal" aria-checked="false"></button></li>
                </ul>
            </div>
        </header>

        <article>
            <h1 data-i18n="privacyTitle"></h1>
            <p data-i18n="privacyIntro"></p>

            <h2 data-i18n="privacyDataTitle"></h2>
            <p data-i18n="privacyDataText"></p>

            <h2 data-i18n="privacyPurposeTitle"></h2>
            <p data-i18n="privacyPurposeText"></p>

            <p class="privacy-note" data-i18n="privacyNote"></p>
        </article>
    </main>
</body>
</html>
