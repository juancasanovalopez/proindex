<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title" data-i18n="title"></title>
    
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    
    <script defer src="./js/bootstrap.bundle.min.js"></script>
    <script defer src="./js/app.js"></script>
</head>
<body>

    <div class="container site-container">
        <header class="blog-header">
            <a class="blog-brand" href="./">Pro Index</a>
            <div class="dropdown style-switcher">
                <button class="btn style-switcher-toggle dropdown-toggle" type="button" id="style-menu-index" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-palette2" aria-hidden="true"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="style-menu-index">
                    <li><button class="dropdown-item" type="button" role="menuitemradio" value="8bit" data-visual-style-option data-i18n="style8Bit" aria-checked="false"></button></li>
                    <li><button class="dropdown-item" type="button" role="menuitemradio" value="16bit" data-visual-style-option data-i18n="style16Bit" aria-checked="false"></button></li>
                    <li><button class="dropdown-item" type="button" role="menuitemradio" value="original" data-visual-style-option data-i18n="styleOriginal" aria-checked="false"></button></li>
                </ul>
            </div>
        </header>

        <section class="blog-intro" aria-labelledby="page-title">
            <h1 id="page-title" data-i18n="title"></h1>
            <p class="subtitle" data-i18n="subtitle"></p>
        </section>


        <div class="row g-5">
            <main id="proyectos-lista" class="project-list col-lg-12" aria-live="polite">
                <div id="estado-cargando" class="status" data-i18n="loading"></div>
                <div id="estado-error" class="error-message hidden" data-i18n="error"></div>
                <div id="estado-vacio" class="status hidden" data-i18n="empty"></div>
            </main>

        </div>

    </div>
    <p class="privacy-notice" data-privacy-notice></p>
</body>
</html>
