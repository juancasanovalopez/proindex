<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title" data-i18n="title"></title>
    
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script defer src="./js/bootstrap.bundle.min.js"></script>
    <script defer src="./js/app.js"></script>
</head>
<body data-page="index">

    <div class="container site-container">
        <div data-layout-header></div>

        <main id="main-content">
            <section class="blog-intro" aria-labelledby="intro-title">
                <p class="editorial-label" data-i18n="directory"></p>
                <h1 id="intro-title" data-i18n="title"></h1>
                <p class="subtitle" data-i18n="subtitle"></p>
                <a class="editorial-link intro-link" href="#projects-heading">
                    <span data-i18n="exploreProjects"></span>
                    <i class="bi bi-arrow-down" aria-hidden="true"></i>
                </a>
            </section>
            <div class="section-heading">
                <h2 id="projects-heading" data-i18n="allProjects"></h2>
                <span class="editorial-label hidden" data-project-count></span>
            </div>
            <div id="proyectos-lista" class="project-list" aria-live="polite" aria-labelledby="projects-heading">
                <div id="estado-cargando" class="status" data-i18n="loading"></div>
                <div id="estado-error" class="error-message hidden" data-i18n="error"></div>
                <div id="estado-vacio" class="status hidden" data-i18n="empty"></div>
            </div>
        </main>

    </div>
    <div data-layout-footer></div>
</body>
</html>
