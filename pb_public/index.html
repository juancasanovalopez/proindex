<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title" data-i18n="title"></title>
    
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    
    <script defer src="./js/bootstrap.bundle.min.js"></script>
    <script defer src="./js/app.js"></script>
</head>
<body>

    <div class="container site-container">
        <header class="blog-header">
            <a class="blog-nav-link" href="index.html" data-i18n="allProjects"></a>
        </header>

        <section class="blog-intro" aria-labelledby="page-title">
            <h1 id="page-title" data-i18n="title"></h1>
            <p class="subtitle" data-i18n="subtitle"></p>
        </section>

        <div class="row g-5">
            <main id="proyectos-lista" class="project-list col-lg-8" aria-live="polite">
                <div id="estado-cargando" class="status" data-i18n="loading"></div>
                <div id="estado-error" class="error-message hidden" data-i18n="error"></div>
                <div id="estado-vacio" class="status hidden" data-i18n="empty"></div>
            </main>

            <aside class="col-lg-4 blog-sidebar">
                <nav aria-label="Navegación del directorio">
                    <h2 data-i18n="directory"></h2>
                    <a class="link" href="index.html" data-i18n="allProjects"></a>
                </nav>
            </aside>
        </div>
    </div>

</body>
</html>
