<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Proyectos</title>
    
    <!-- Enlace relativo al CSS modular -->
    <link rel="stylesheet" href="./css/styles.css">
    
    <!-- Enlace relativo al JS modular (con defer para que cargue tras el DOM) -->
    <script defer src="./js/app.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1 data-i18n="title"></h1>
            <div class="subtitle" data-i18n="subtitle"></div>
        </header>

        <div id="estado-cargando" class="status" data-i18n="loading"></div>
        <div id="estado-error" class="error-message hidden" data-i18n="error"></div>
        <div id="estado-vacio" class="status hidden" data-i18n="empty"></div>

        <main id="proyectos-lista" class="project-list"></main>
    </div>

</body>
</html>
