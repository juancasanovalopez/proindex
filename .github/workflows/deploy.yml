name: Deploy PocketBase

on:
  push:
    branches:
      - main  # Cambia a master si es tu rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar en el servidor vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ~/pocketbase-app
            cd ~/pocketbase-app

            if [ ! -d ".git" ]; then
              git clone https://github.com{{ github.repository }}.git .
            else
              git pull origin main
            fi

            # Despliegue usando Docker Compose (descarga, recrea y levanta en segundo plano)
            docker compose down --remove-orphans
            docker compose up -d --build
